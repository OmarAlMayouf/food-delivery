databaseChangeLog:
  - changeSet:
      id: 2
      author: Omar
      changes:
        - createTable:
            tableName: cuisines
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    unique: true
                    nullable: false
